[program:automation]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/python3 -m uvicorn neko_automation.main:app --host 0.0.0.0 --port 9100 --app-dir /opt/neko-automation --workers 1 --timeout-keep-alive 75
directory=/opt/neko-automation
stopsignal=TERM
stopwaitsecs=20
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/automation.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

; ensure bind-mounted persistent dirs are writable by the neko user
; (docker auto-creates missing host dirs as root)
[program:fs-permissions]
command=/bin/bash -c "mkdir -p /home/neko/.mozilla /var/lib/neko-automation && chown -R neko:neko /home/neko/.mozilla /var/lib/neko-automation"
priority=100
user=root
autorestart=false
startsecs=0
stdout_logfile=/var/log/neko/automation.log
stdout_logfile_maxbytes=50MB
redirect_stderr=true
